name: ci
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
env:
  REGISTRY_IMAGE: rikhuijzer/fx
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Record Rust version for caching
        id: rust-version
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust-version.outputs.version }}-
      - run: cargo test --locked

  # Based on https://docs.docker.com/build/ci/github-actions/multi-platform/.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Record Rust version for caching
        id: rust-version
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.os }}-${{ steps.rust-version.outputs.version }}-
      - name: setup x86 musl dependencies
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools
      - name: Install jas v0.4.0
        run: |
          dir="$RUNNER_TEMP/jas-bin"
          mkdir -p "$dir"
          cd "$dir"
          curl --fail --location --retry 2 \
            https://github.com/rikhuijzer/jas/releases/download/v0.4.0/jas -o jas
          sha="437b2988dbc58d5867b908bb67366b766b9bcd3ed4b266a129f8d96d75301f6e"
          hash=(sha256sum)
          command -v sha256sum >/dev/null 2>&1 || hash=(shasum -a 256)
          printf '%s  jas\n' "$sha" | "${hash[@]}" -c -
          chmod +x jas
          printf '%s\n' "$dir" >> "$GITHUB_PATH"
      - id: just-sha
        run: |
          SHA=""
          if [ ${{ matrix.os }} == 'ubuntu-24.04-arm' ]; then
            SHA="d065d0df1a1f99529869fba8a5b3e0a25c1795b9007099b00dfabe29c7c1f7b6"
          else
            SHA="181b91d0ceebe8a57723fb648ed2ce1a44d849438ce2e658339df4f8db5f1263"
          fi
          echo "SHA=$SHA" >> $GITHUB_OUTPUT
      - run: >
          jas install
          --gh casey/just@1.40.0
          --sha ${{ steps.just-sha.outputs.SHA }}
          --gh-token ${{ secrets.GITHUB_TOKEN }}
      - run: sudo timedatectl set-timezone Europe/Amsterdam
      - if: github.ref_type != 'tag'
        run: date +'%Y-%m-%d %H:%M' > fx/src/version.txt
      - if: github.ref_type == 'tag'
        run: printf '%s\n' "$GITHUB_REF_NAME" > fx/src/version.txt
      - run: just release
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        if: github.event_name != 'pull_request' # Also run on tag.
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name != 'pull_request' # Also run on tag.
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        if: github.event_name != 'pull_request' # Also run on tag.
      - id: platform
        run: |
          PLATFORM=""
          if [ ${{ matrix.os }} == 'ubuntu-24.04-arm' ]; then
            PLATFORM="linux/arm64"
          else
            PLATFORM="linux/amd64"
          fi
          echo "PLATFORM=$PLATFORM" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        if: github.event_name != 'pull_request' # Also run on tag.
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: './public'
          platforms: ${{ steps.platform.outputs.PLATFORM }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: github.event_name != 'pull_request' # Also run on tag.
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request' # Also run on tag.
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    if: github.event_name != 'pull_request' # Also run on tag.
    permissions:
      # Required by softprops/action-gh-release.
      contents: write
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0 v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        if: github.ref_type == 'tag'
        with:
          body: |
            Notable changes since the last release are documented in the [CHANGELOG.md](https://github.com/rikhuijzer/fx/blob/main/CHANGELOG.md) file.
