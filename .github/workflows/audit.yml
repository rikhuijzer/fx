name: audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install jas
        run: |
          mkdir -p "$RUNNER_TEMP/jas"
          cd "$RUNNER_TEMP/jas"
          curl --fail --location --retry 2 \
            https://github.com/rikhuijzer/jas/releases/download/v0.4.0/jas -o jas
          sha="437b2988dbc58d5867b908bb67366b766b9bcd3ed4b266a129f8d96d75301f6e"
          printf '%s  jas\n' "$sha" | sha256sum -c -
          chmod +x jas
          printf '%s\n' "$RUNNER_TEMP/jas" >> "$GITHUB_PATH"
      - run: >
          jas install
          --gh EmbarkStudios/cargo-deny@0.19.0
          --sha 0e8c2aa59128612c90d9e09c02204e912f29a5b8d9a64671b94608cbe09e064f
          --gh-token ${{ secrets.GITHUB_TOKEN }}
      - run: cargo-deny check advisories
